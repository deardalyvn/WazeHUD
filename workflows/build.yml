name: Build ESP32-CYD Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép nhấn nút bấm build thủ công bất kỳ lúc nào

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32
          path: 'waze-hud'

      - name: Package Firmware Files
        run: |
          mkdir -p firmware_bin
          cp waze-hud/build/bootloader/bootloader.bin firmware_bin/ || true
          cp waze-hud/build/partition_table/partition-table.bin firmware_bin/ || true
          cp waze-hud/build/*.bin firmware_bin/ || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-cyd-firmware
          path: firmware_bin/
